let view = "points";
const idxIn = [], idxOut = [];
D.o.forEach((o, i) => (o ? idxOut : idxIn).push(i));
const pick = (a, idx) => idx.map(i => a[i]);

function traces() {
  if (view === "points") {
    return [{ type: "scatter3d", mode: "markers", x: D.x, y: D.y, z: D.z, hoverinfo: "skip",
              marker: { size: 1.8, color: "#475569", opacity: 0.55, line: { width: 0 } } }];
  }
  return [
    { type: "mesh3d", x: D.mesh.x, y: D.mesh.y, z: D.mesh.z, i: D.mesh.i, j: D.mesh.j, k: D.mesh.k,
      color: "#4a6fb5", opacity: 0.18, flatshading: true, hoverinfo: "skip",

function layout() {
  const ax = (t) => ({ title: { text: t, font: { size: 15, color: "#0f172a" } }, color: "#64748b",
    gridcolor: "#e2e8f0", zerolinecolor: "#e2e8f0", showbackground: false, tickfont: { size: 11 } });
  return { paper_bgcolor: "#ffffff", margin: { l: 0, r: 0, t: 0, b: 0 }, showlegend: false,
    scene: { xaxis: ax("PC1 (" + D.var[0] + "%)"), yaxis: ax("PC2 (" + D.var[1] + "%)"), zaxis: ax("PC3 (" + D.var[2] + "%)"),
             aspectmode: "data", camera: { eye: { x: 1.35, y: -1.35, z: 0.7 } } },
    uirevision: "keep" };
}

function legendAndNote() {
  const fmt = n => n.toLocaleString("en-US");
  if (view === "points") {
    document.getElementById("legend").innerHTML = '<span><span class="sw" style="background:#475569"></span>Wallet</span>';
    document.getElementById("note").textContent = fmt(D.n) + " wallets placed by their 13 trading features";
  } else {
    document.getElementById("legend").innerHTML =
      '<span><span class="sw sq" style="background:#4a6fb5"></span>Alpha shape</span>' +
      '<span><span class="sw" style="background:#94a3b8"></span>Inside</span>' +
      '<span><span class="sw" style="background:#d97706"></span>Outlier</span>';
    document.getElementById("note").textContent = fmt(D.nout) + " of " + fmt(D.n) + " wallets lie outside the shape (" + (100 * D.nout / D.n).toFixed(1) + "%)";
  }
}

let drawn = false;
const plotDiv = () => document.getElementById("plotInner");
function draw() {
  if (!window.Plotly) { document.getElementById("plot").innerHTML = '<div class="loading">The 3D library could not load. Check the internet connection and reload.</div>'; return; }
  if (!drawn) document.getElementById("plot").innerHTML = '<div id="plotInner"></div>';
  Plotly.react(plotDiv(), traces(), layout(), { responsive: true, displaylogo: false, displayModeBar: false });
  drawn = true; legendAndNote();
}

document.querySelector(".switch").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.view === view) return;
  view = b.dataset.view;
  document.querySelectorAll(".switch button").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === view));
  draw();
});
draw();
